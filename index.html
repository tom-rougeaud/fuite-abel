<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>La fuite d’Abel</title>
<meta name="theme-color" content="#1d2b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuite d’Abel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#1d2b4a;--panel:#26385e;--panel2:#33497a;--sand:#e8c27a;--sand2:#c99c4e;--ink:#f4f1e8;--teal:#5a9aa8;--coral:#d9826b;--danger:#b5524a;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:none;padding:calc(var(--sat) + 12px) 14px calc(var(--sab) + 14px)}
.scr.on{display:block}
button,.item,.cat,.lv{pointer-events:auto;font:inherit;color:inherit;cursor:pointer}
.ic{width:1em;height:1em;display:block}
.ic.big{font-size:56px;margin:0 auto}.ic.inl{display:inline-block;vertical-align:-0.15em}
/* boutons ronds */
.rb{width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:var(--panel2);color:var(--ink);font-size:34px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.28);pointer-events:auto}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.rb.big{width:92px;height:92px;font-size:46px;background:var(--sand);color:#2a2113;border-color:#f6dfaa}
.rb.warn{background:var(--danger);border-color:#e0928a;color:#fff}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,30,56,.72);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px 6px 8px;font-size:22px;font-weight:800;pointer-events:none}
.pill .ic{font-size:30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* accueil */
#scr-home .title{position:absolute;left:0;right:0;top:calc(var(--sat) + 70px);text-align:center;font-size:clamp(28px,8.4vw,44px);font-weight:900;letter-spacing:.5px;color:var(--ink);text-shadow:0 3px 0 rgba(20,30,56,.85),0 0 18px rgba(20,30,56,.6);line-height:1.05;pointer-events:none}
#scr-home .bottom{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 26px);display:flex;align-items:center;justify-content:center;gap:34px}
.play{width:124px;height:124px;border-radius:50%;border:4px solid #f6dfaa;background:var(--sand);color:#2a2113;font-size:68px;display:flex;align-items:center;justify-content:center;padding:0 0 0 8px;box-shadow:0 7px 0 var(--sand2),0 12px 24px rgba(0,0,0,.35);animation:pulse 2.2s ease-in-out infinite}
.play:active{transform:translateY(5px)}
@keyframes pulse{50%{transform:scale(1.06)}}
.b-inst{position:absolute;right:14px;top:calc(var(--sat) + 12px)}
.b-inst.rb{width:56px;height:56px;font-size:28px}
/* carte */
.sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#26385ee6,#1d2b4af2);border-radius:28px 28px 0 0;padding:16px 12px calc(var(--sab) + 16px);box-shadow:0 -8px 28px rgba(0,0,0,.35);pointer-events:auto}
#levels{display:flex;gap:12px;overflow-x:auto;padding:4px 6px 12px;scrollbar-width:none;touch-action:pan-x}
#levels::-webkit-scrollbar,#cats::-webkit-scrollbar,#items::-webkit-scrollbar{display:none}
.lv{flex:0 0 100px;height:128px;border-radius:22px;border:3px solid rgba(255,255,255,.2);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px 8px;background:var(--panel2)}
.lv.sel{border-color:var(--sand);box-shadow:0 0 0 3px rgba(232,194,122,.35)}
.lv .lvi{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff}
.t0{background:#6a5f8a}.t1{background:#3f9aa8}.t2{background:#7aa0c8}.t3{background:#c4854e}.t4{background:#5a8f55}
.lv .stars{display:flex;gap:2px;font-size:20px}
.lv.lock{filter:saturate(.35) brightness(.8)}
.lv .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(15,22,40,.45);border-radius:20px}
.row{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:8px}
#speeds{display:flex;gap:10px}
.sp{width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.2);background:var(--panel2);font-size:38px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.sp.sel{background:var(--teal);border-color:#bfe3ea}
.back{position:static}
/* HUD */
#scr-hud{pointer-events:none}
#scr-hud .top{align-items:flex-start}
#hearts{display:flex;gap:2px;font-size:34px;color:#e0605a;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#hearts .off{color:#cfd6e4;opacity:.7}
#bar{position:relative;flex:1;height:14px;margin:12px 10px 0;background:rgba(15,22,40,.6);border:2px solid rgba(255,255,255,.3);border-radius:99px}
#bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sand);border-radius:99px;width:0}
#bar u{position:absolute;top:-17px;width:36px;height:36px;margin-left:-18px;font-size:26px;text-decoration:none;background:var(--teal);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#bar s{position:absolute;right:-12px;top:-14px;width:30px;height:30px;font-size:24px;color:var(--sand);text-decoration:none}
#hudr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#btn-pause{pointer-events:auto}
#chips{position:absolute;left:14px;top:calc(var(--sat) + 62px);display:flex;gap:8px}
.chip{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;overflow:hidden}
.chip em{position:absolute;left:0;right:0;bottom:0;height:calc(100% - var(--f));background:rgba(10,16,32,.5)}
.chip em{top:0;bottom:auto;height:calc(100% - var(--f))}
#warn{position:absolute;left:50%;bottom:calc(var(--sab) + 90px);margin-left:-32px;width:64px;height:64px;border-radius:50%;background:var(--danger);border:3px solid #fff;font-size:38px;display:none;align-items:center;justify-content:center;animation:pulse .6s infinite;color:#fff}
#warn.on{display:flex}
/* pause / résultat */
#scr-pause,#scr-result{background:rgba(12,18,36,.62);display:none;align-items:center;justify-content:center}
#scr-pause.on,#scr-result.on{display:flex}
.panel{background:var(--panel);border:3px solid rgba(255,255,255,.2);border-radius:30px;padding:26px 24px;min-width:270px;text-align:center;pointer-events:auto}
.rstars{display:flex;justify-content:center;gap:6px;font-size:76px;min-height:80px}
.rs{transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;display:block;width:1em;height:1em}
@keyframes pop{to{transform:scale(1)}}
.sad{font-size:80px;color:var(--coral);display:block;width:1em;height:1em}
.gain{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;font-weight:900;margin:12px 0 4px}.gain .ic{font-size:44px}
/* boutique */
#scr-shop .sheet{padding-top:10px}
#cats,#items{display:flex;gap:10px;overflow-x:auto;padding:6px 6px;scrollbar-width:none;touch-action:pan-x}
.cat{flex:0 0 52px;height:52px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:var(--panel2);font-size:30px;display:flex;align-items:center;justify-content:center;padding:0}
.cat.sel{background:var(--sand);color:#2a2113;border-color:#f6dfaa}
.item{flex:0 0 78px;height:92px;border-radius:18px;border:3px solid rgba(255,255,255,.18);background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;padding:0 0 14px}
.item.on{border-color:var(--sand)}.item.pv{border-color:var(--teal);box-shadow:0 0 0 3px rgba(90,154,168,.4)}
.item .sw{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:36px}
.item .dot{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.7);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.item .gl{position:relative;font-size:38px;color:var(--ink)}.item .gl.dk{font-size:24px;color:rgba(20,28,48,.85);filter:drop-shadow(0 0 2px rgba(255,255,255,.7))}
.item .tag{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--sand);border:2px solid #fff}
.item .ok{position:absolute;right:4px;bottom:4px;width:22px;height:22px;background:var(--teal);border-radius:50%;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;padding:3px}
.item .ok .ic{width:100%;height:100%}
.item .pr{position:absolute;bottom:4px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:800}
.item .pr .ic{font-size:17px}
.item.buy .sw{opacity:.85}
#buybar{position:absolute;right:16px;bottom:calc(var(--sab) + 190px);pointer-events:none}
.buy-btn{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--sand);color:#2a2113;border:3px solid #f6dfaa;border-radius:999px;padding:8px 18px 8px 14px;font-size:32px;font-weight:900;box-shadow:0 5px 0 var(--sand2),0 10px 18px rgba(0,0,0,.3)}
.buy-btn span{display:flex;align-items:center;gap:4px;font-size:26px}.buy-btn span .ic{font-size:30px}
.buy-btn.no{background:#8e98ad;border-color:#b9c1d1;box-shadow:0 5px 0 #6a7488;color:#2c3446}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* réglages */
#scr-settings{background:rgba(20,30,56,.94)}
#scr-settings .top{margin-bottom:10px}
#setbox{overflow-y:auto;max-height:calc(100% - 90px);display:flex;flex-direction:column;gap:10px;pointer-events:auto;touch-action:pan-y;padding-bottom:20px}
.srow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid rgba(255,255,255,.14);border-radius:20px;padding:10px 12px}
.srow .si{font-size:30px;width:34px;color:var(--sand)}.srow .sl{flex:1;font-size:18px;font-weight:700}
.tg{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--panel2);font-size:28px;display:flex;align-items:center;justify-content:center;padding:0}
.tg.on{background:var(--teal)}
.seg{display:flex;border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.seg button{border:0;background:var(--panel2);padding:12px 14px;font-weight:700;font-size:16px}.seg button.on{background:var(--teal);color:#fff}
/* modale */
#modal{position:fixed;inset:0;background:rgba(10,16,32,.72);display:none;align-items:center;justify-content:center;padding:20px;pointer-events:auto}
#modal.on{display:flex}
.mbox{background:var(--panel);border:3px solid rgba(255,255,255,.22);border-radius:26px;padding:22px 20px;max-width:440px;width:100%;max-height:86vh;overflow:auto;text-align:center;touch-action:pan-y}
.mbox h2{margin:0 0 10px;font-size:22px}.mbox p{margin:10px 0;line-height:1.45;font-size:16px;text-align:left}
.mbox .row{margin-top:16px}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:30px;font-weight:900;z-index:9}
#boot i{width:42px;height:42px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--sand);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:700px){.sheet{left:50%;transform:translateX(-50%);max-width:560px}#scr-home .title{top:calc(var(--sat) + 40px)}}
@media (prefers-reduced-motion:reduce){.play,#warn{animation:none}.rs{animation-duration:.01s}}
</style>
</head>
